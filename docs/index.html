<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Новая сделка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #17212b);
    --text: var(--tg-theme-text-color, #f5f5f5);
    --hint: var(--tg-theme-hint-color, #8b9aa7);
    --field: var(--tg-theme-secondary-bg-color, #232e3c);
    --accent: var(--tg-theme-button-color, #5288c1);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --short: #e5534b;
    --long: #3fb950;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px 16px 90px; background: var(--bg); color: var(--text);
         font: 16px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 14px; }
  .seg { display: flex; gap: 8px; margin-bottom: 14px; }
  .seg button { flex: 1; padding: 11px 6px; border: 2px solid transparent; border-radius: 10px;
                background: var(--field); color: var(--text); font-size: 15px; font-weight: 600; }
  .seg button.on { border-color: var(--accent); }
  .seg.side button.on[data-v="short"] { background: var(--short); border-color: var(--short); color: #fff; }
  .seg.side button.on[data-v="long"] { background: var(--long); border-color: var(--long); color: #fff; }
  label { display: block; font-size: 13px; color: var(--hint); margin: 12px 0 5px; }
  input { width: 100%; padding: 12px; border: 0; border-radius: 10px; background: var(--field);
          color: var(--text); font-size: 17px; outline: none; }
  input:focus { box-shadow: 0 0 0 2px var(--accent); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .chips button { padding: 7px 12px; border: 0; border-radius: 16px; background: var(--field);
                  color: var(--text); font-size: 14px; }
  .chips button.on { background: var(--accent); color: var(--accent-text); }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .hint { font-size: 13px; color: var(--hint); margin-top: 14px; }
  .err { color: var(--short); font-size: 14px; margin-top: 10px; min-height: 18px; }
  #send { display: none; width: 100%; margin-top: 18px; padding: 14px; border: 0; border-radius: 10px;
          background: var(--accent); color: var(--accent-text); font-size: 16px; font-weight: 600; }
  .only-in { transition: opacity .15s; }
  body.analyze .only-in { display: none; }
</style>
</head>
<body>
  <h1>Помощник по сделкам</h1>

  <div class="seg mode">
    <button data-v="in" class="on">Я вошёл</button>
    <button data-v="analyze">Анализ монеты</button>
  </div>

  <label for="sym">Монета</label>
  <input id="sym" placeholder="aero" autocapitalize="none" autocomplete="off" spellcheck="false">

  <div class="only-in">
    <label>Направление</label>
    <div class="seg side">
      <button data-v="short" class="on">Шорт</button>
      <button data-v="long">Лонг</button>
    </div>

    <label for="entry">Цена входа</label>
    <input id="entry" inputmode="decimal" placeholder="0.553">

    <div class="row">
      <div>
        <label for="lev">Плечо</label>
        <input id="lev" inputmode="decimal" placeholder="20">
      </div>
      <div>
        <label for="margin">Маржа, $</label>
        <input id="margin" inputmode="decimal" placeholder="10">
      </div>
    </div>
    <div class="chips" id="levchips">
      <button data-v="10">x10</button><button data-v="20">x20</button>
      <button data-v="25">x25</button><button data-v="50">x50</button>
    </div>

    <label for="stop">Свой стоп (необязательно)</label>
    <input id="stop" inputmode="decimal" placeholder="бот поставит по графику">
  </div>

  <div class="err" id="err"></div>
  <button id="send">Отправить</button>
  <div class="hint">Ответ придёт в чат с ботом, обычно за несколько секунд.</div>

<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  const $ = (id) => document.getElementById(id);
  let mode = "in", side = "short";

  function setSeg(sel, attr, cb) {
    document.querySelectorAll(sel + " button").forEach((b) => b.addEventListener("click", () => {
      document.querySelectorAll(sel + " button").forEach((x) => x.classList.remove("on"));
      b.classList.add("on");
      cb(b.dataset.v);
      update();
    }));
  }
  setSeg(".seg.mode", "v", (v) => { mode = v; document.body.classList.toggle("analyze", v === "analyze"); });
  setSeg(".seg.side", "v", (v) => { side = v; });
  document.querySelectorAll("#levchips button").forEach((b) => b.addEventListener("click", () => {
    $("lev").value = b.dataset.v; update();
  }));

  const n = (s) => { const v = parseFloat(String(s).trim().replace(",", ".")); return isFinite(v) ? v : null; };

  function collect() {
    const sym = $("sym").value.trim();
    if (!sym) return { err: "Укажите монету" };
    if (mode === "analyze") return { data: { mode: "analyze", sym } };
    const entry = n($("entry").value), lev = n($("lev").value), margin = n($("margin").value);
    const stop = $("stop").value.trim() ? n($("stop").value) : null;
    if (!entry || entry <= 0) return { err: "Укажите цену входа" };
    if ($("lev").value.trim() && (!lev || lev < 1 || lev > 125)) return { err: "Плечо — число от 1 до 125" };
    if ($("margin").value.trim() && (!margin || margin <= 0)) return { err: "Маржа — число больше 0" };
    if ($("stop").value.trim()) {
      if (!stop) return { err: "Стоп — число" };
      if (side === "short" && stop <= entry) return { err: "Для шорта стоп должен быть выше входа" };
      if (side === "long" && stop >= entry) return { err: "Для лонга стоп должен быть ниже входа" };
    }
    document.querySelectorAll("#levchips button").forEach((b) => b.classList.toggle("on", lev === n(b.dataset.v)));
    return { data: { mode: "in", sym, side, entry, lev, margin, stop } };
  }

  function update() {
    const r = collect();
    $("err").textContent = "";
    const label = mode === "analyze" ? "Анализировать" : "Отправить вход";
    if (tg) {
      tg.MainButton.setText(label);
      r.data ? tg.MainButton.show() : tg.MainButton.hide();
    } else {
      $("send").textContent = label;
      $("send").style.display = r.data ? "block" : "none";
    }
  }

  function submit() {
    const r = collect();
    if (r.err) { $("err").textContent = r.err; return; }
    const payload = JSON.stringify(r.data);
    if (tg && tg.sendData) {
      tg.sendData(payload);  // окно закроется, данные уйдут боту
    } else {
      $("err").textContent = "Откройте форму кнопкой в чате с ботом.";
    }
  }

  document.querySelectorAll("input").forEach((i) => i.addEventListener("input", update));
  $("send").addEventListener("click", submit);
  if (tg) {
    tg.ready();
    tg.expand();
    tg.MainButton.onClick(submit);
  }
  update();
</script>
</body>
</html>
